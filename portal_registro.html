<!-- Portal Registration View -->
<div class="row justify-content-center py-4">
  <div class="col-md-7 col-lg-6">
    <div class="card card-custom shadow-lg">
      <div class="card-header bg-primary text-white text-center py-3">
        <h4 class="fw-bold mb-0"><i class="fas fa-user-plus me-2"></i>Registro de Cliente BitFix</h4>
      </div>
      <div class="card-body p-4">
        <form onsubmit="execRegistroCliente(event)">
          <div class="mb-3">
            <label class="form-label fw-bold">Teléfono (10 dígitos) *</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-phone"></i></span>
              <input type="tel" id="regPhone" class="form-control" placeholder="9991000001" required maxlength="10" pattern="\d{10}">
            </div>
            <div class="form-text">Será tu usuario para consultar tus reparaciones.</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Nombre Completo *</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user"></i></span>
              <input type="text" id="regNombre" class="form-control" placeholder="Juan Pérez" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Correo Electrónico *</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-envelope"></i></span>
              <input type="email" id="regCorreo" class="form-control" placeholder="juan@ejemplo.com" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Contraseña *</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock"></i></span>
              <input type="password" id="regPass" class="form-control" placeholder="••••••••" required minlength="6">
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">Confirmar Contraseña *</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-check-double"></i></span>
              <input type="password" id="regPassConfirm" class="form-control" placeholder="••••••••" required minlength="6">
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 btn-lg shadow">
            <i class="fas fa-user-check me-2"></i> Crear Mi Cuenta
          </button>
        </form>

        <hr class="my-4">
        <div class="text-center">
          <span class="text-muted small">¿Ya tienes cuenta?</span><br>
          <a href="?page=login" class="fw-bold text-decoration-none">
            <i class="fas fa-sign-in-alt me-1"></i> Iniciar Sesión
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function execRegistroCliente(e) {
    e.preventDefault();
    var tel = document.getElementById("regPhone").value.trim();
    var nom = document.getElementById("regNombre").value.trim();
    var cor = document.getElementById("regCorreo").value.trim();
    var pass = document.getElementById("regPass").value.trim();
    var conf = document.getElementById("regPassConfirm").value.trim();

    if (pass !== conf) {
      showToast("danger", "Error de Validación", "Las contraseñas no coinciden.");
      return;
    }

    var payload = {
      Telefono: tel,
      Nombre: nom,
      Correo: cor,
      Password: pass
    };

    runGas("registrarClientePortal", payload).then(res => {
      if (res.success) {
        setClientToken(res.token);
        showToast("success", "Registro Exitoso", res.message);
        setTimeout(() => { window.location.href = "?page=portal"; }, 1000);
      }
    });
  }
</script>
