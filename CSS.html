<style>
  :root {
    --primary: #6B2C91;
    --primary-light: #8e44ad;
    --secondary: #FFFFFF;
    --accent: #FF6B35;
    --text: #333333;
    --bg-light: #f4f7f6;
    --error: #e74c3c;
    --success: #2ecc71;
  }

  body {
    font-family: 'Roboto', sans-serif;
    background-color: var(--bg-light);
    color: var(--text);
    margin: 0;
    padding: 0;
  }

  h1, h2, h3, h4 {
    font-family: 'Montserrat', sans-serif;
    color: var(--primary);
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
  }

  .card {
    background: var(--secondary);
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    padding: 25px;
    margin-bottom: 20px;
  }

  /* Form Elements */
  .form-group {
    margin-bottom: 20px;
    position: relative;
  }

  .form-control {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    transition: border-color 0.3s;
    box-sizing: border-box;
  }

  .form-control:focus {
    outline: none;
    border-color: var(--primary);
  }

  label {
    display: block;
    margin-bottom: 5px;
    font-weight: 500;
  }

  /* Buttons */
  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.3s, transform 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn-primary {
    background-color: var(--primary);
    color: white;
  }

  .btn-accent {
    background-color: var(--accent);
    color: white;
  }

  .btn-outline {
    background-color: transparent;
    border: 2px solid var(--primary);
    color: var(--primary);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Progress Bar */
  .progress-container {
    margin-bottom: 30px;
  }

  .progress-bar {
    height: 8px;
    background-color: #eee;
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(to right, var(--primary), var(--primary-light));
    width: 0%;
    transition: width 0.4s ease;
  }

  .progress-steps {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 12px;
    color: #777;
  }

  /* Checkboxes */
  .checkbox-group {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 15px;
    padding: 10px;
    border-radius: 6px;
    transition: background 0.2s;
  }

  .checkbox-group:hover {
    background: #f9f9f9;
  }

  .checkbox-group input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin-top: 2px;
  }

  /* Badges */
  .badge {
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
  }

  .badge-info { background: #d1ecf1; color: #0c5460; }
  .badge-success { background: #d4edda; color: #155724; }
  .badge-warning { background: #fff3cd; color: #856404; }
  .badge-danger { background: #f8d7da; color: #721c24; }

  /* Utility */
  .hidden { display: none !important; }
  .text-center { text-align: center; }
  .mt-4 { margin-top: 1.5rem; }

  /* Mobile First */
  @media (max-width: 600px) {
    .container { padding: 10px; }
    .card { padding: 15px; }
    .btn { width: 100%; margin-bottom: 10px; }
  }
</style>
